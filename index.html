<!doctype html>
<html lang="zh-Hant" data-lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEMS Stakeholder Atlas</title>
<meta name="description" content="Every expert, lab, agency, company and community GEMS Taiwan has worked with through iGEM, 2022 to today. 2022 年至今，GEMS Taiwan 在 iGEM 中合作與交流過的所有利害關係人。">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta property="og:title" content="GEMS Stakeholder Atlas">
<meta property="og:description" content="GEMS Taiwan × iGEM, 2022 to today: the people and organisations behind our work.">
<meta property="og:image" content="https://timmy97-tw.github.io/GEMS_Stakeholder/assets/img/og.jpg">
<meta property="og:url" content="https://timmy97-tw.github.io/GEMS_Stakeholder/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/img/gems-mark.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/gems-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@0,500;1,500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="gnav" id="gnav">
  <div class="gnav-inner">
    <a class="brand" href="#/overview" aria-label="GEMS Stakeholder Atlas">
      <svg class="brand-mark" viewBox="90 50 890 640" aria-hidden="true"><path d="M535 660L125 235L270 80H800L950 235L600 590L395 369A95 95 0 1 1 540 248A95 95 0 1 1 685 369L605 455" fill="none" stroke="#00A7BA" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand-text"><span data-i18n="brand.sub">Stakeholder Atlas</span></span>
    </a>
    <nav class="tabs" id="tabs" aria-label="Views">
      <a href="#/overview" data-view="overview" data-i18n="nav.overview">Overview</a>
      <a href="#/map" data-view="map" data-i18n="nav.map">Map</a>
      <a href="#/directory" data-view="directory" data-i18n="nav.directory">Directory</a>
      <a href="#/table" data-view="table" data-i18n="nav.table">Table</a>
      <a href="#/timeline" data-view="timeline" data-i18n="nav.timeline">Timeline</a>
    </nav>
    <div class="seg lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="zh" aria-pressed="true">中</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <span class="seg-thumb" aria-hidden="true"></span>
    </div>
  </div>
</header>

<main id="app">

  <!-- ============ OVERVIEW ============ -->
  <section class="view" id="view-overview" data-view="overview">
    <div class="hero">
      <h1 class="hero-logo">
        <svg class="gems-logo" viewBox="120 150 1880 500" role="img" aria-labelledby="gems-logo-title">
          <title id="gems-logo-title">GEMS Academy</title>
          <defs>
            <linearGradient id="gems-teal" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#19bccd"/>
              <stop offset="1" stop-color="#0096ab"/>
            </linearGradient>
          </defs>
          <text class="gl-word" x="150" y="494" textLength="1310" lengthAdjust="spacingAndGlyphs">GEMS</text>
          <text class="gl-sub" x="160" y="636" textLength="1788" lengthAdjust="spacing">ACADEMY</text>
          <g transform="translate(1482 140) scale(.5)">
            <path class="gl-mark-shadow" d="M535 660L125 235L270 80H800L950 235L600 590L395 369A95 95 0 1 1 540 248A95 95 0 1 1 685 369L605 455" pathLength="1"/>
            <path class="gl-mark" d="M535 660L125 235L270 80H800L950 235L600 590L395 369A95 95 0 1 1 540 248A95 95 0 1 1 685 369L605 455" pathLength="1"/>
          </g>
        </svg>
      </h1>
    </div>

    <div class="wrap">
      <div class="stats" id="stats"></div>
    </div>

    <div class="wrap grid-2">
      <article class="panel">
        <header class="panel-head">
          <h2 data-i18n="ov.byYear">Engagements by year</h2>
        </header>
        <div id="chart-years" class="chart-years"></div>
        <div id="chart-legend" class="legend"></div>
      </article>
      <article class="panel">
        <header class="panel-head">
          <h2 data-i18n="ov.byCat">Who we work with</h2>
        </header>
        <div id="chart-cats" class="chart-cats"></div>
      </article>
    </div>

    <div class="wrap">
      <article class="panel">
        <header class="panel-head">
          <h2 data-i18n="ov.where">Where they are</h2>
        </header>
        <div id="chart-cities" class="chart-cities"></div>
      </article>
    </div>

    <div class="wrap">
      <header class="section-head">
        <h2 data-i18n="ov.logos">Organisations</h2>
      </header>
      <div id="logo-wall" class="logo-wall"></div>
    </div>
  </section>

  <!-- ============ MAP ============ -->
  <section class="view view-map" id="view-map" data-view="map" hidden>
    <div class="map-shell">
      <aside class="map-side" id="map-side">
        <div class="map-side-head">
          <div class="seg seg-sm" id="map-scope" role="group" aria-label="Map scope">
            <button type="button" data-scope="tw" aria-pressed="true" data-i18n="map.taiwan">Taiwan</button>
            <button type="button" data-scope="world" aria-pressed="false" data-i18n="map.world">World</button>
            <span class="seg-thumb" aria-hidden="true"></span>
          </div>
          <div class="filterbar compact" data-filterbar></div>
          <p class="map-count muted" id="map-count"></p>
        </div>
        <ol class="map-list" id="map-list"></ol>
      </aside>
      <div class="map-canvas" id="map"></div>
    </div>
  </section>

  <!-- ============ DIRECTORY ============ -->
  <section class="view" id="view-directory" data-view="directory" hidden>
    <div class="wrap page-head">
      <h1 class="page-title" data-i18n="dir.title">Directory</h1>
    </div>
    <div class="wrap sticky-filters">
      <div class="filterbar" data-filterbar></div>
      <div class="sortbar">
        <span class="muted" id="dir-count"></span>
        <label class="select">
          <span class="sr-only" data-i18n="sort.label">Sort</span>
          <select id="dir-sort">
            <option value="recent" data-i18n="sort.recent">Most recent</option>
            <option value="name" data-i18n="sort.name">Name A–Z</option>
            <option value="org" data-i18n="sort.org">Organisation</option>
            <option value="count" data-i18n="sort.count">Most engagements</option>
          </select>
        </label>
      </div>
    </div>
    <div class="wrap">
      <div class="cards" id="cards"></div>
    </div>
  </section>

  <!-- ============ TABLE ============ -->
  <section class="view" id="view-table" data-view="table" hidden>
    <div class="wrap page-head">
      <h1 class="page-title" data-i18n="tbl.title">Stakeholder list</h1>
    </div>
    <div class="wrap sticky-filters">
      <div class="filterbar" data-filterbar></div>
      <div class="tbl-actions">
        <span class="muted" id="tbl-count"></span>
        <div class="tbl-buttons">
          <button type="button" class="btn btn-quiet" id="btn-compare" disabled><span data-i18n="tbl.compare">Compare</span> <span class="badge" id="compare-n">0</span></button>
          <button type="button" class="btn btn-quiet" id="btn-csv-view" data-i18n="tbl.csvView">Export view (CSV)</button>
          <button type="button" class="btn btn-primary btn-sm" id="btn-csv-all" data-i18n="tbl.csvAll">Export all (CSV)</button>
        </div>
      </div>
    </div>
    <div class="wrap">
      <div class="table-wrap">
        <table class="tbl" id="tbl">
          <thead><tr id="tbl-head"></tr></thead>
          <tbody id="tbl-body"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ============ TIMELINE ============ -->
  <section class="view" id="view-timeline" data-view="timeline" hidden>
    <div class="wrap page-head">
      <h1 class="page-title" data-i18n="tl.title">Year by year</h1>
    </div>
    <div id="timeline"></div>
  </section>

</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <p><span data-i18n="foot.line">GEMS Taiwan · iGEM stakeholder records, compiled from our team wikis.</span> <span class="muted" id="foot-updated"></span></p>
    <p class="muted footer-links">
      <a href="https://2022.igem.wiki/gems-taiwan/human-practices" target="_blank" rel="noopener">2022</a> ·
      <a href="https://2023.igem.wiki/gems-taiwan/human-practices" target="_blank" rel="noopener">2023</a> ·
      <a href="https://2024.igem.wiki/gems-taiwan/human-practices" target="_blank" rel="noopener">2024</a> ·
      <a href="https://2025.igem.wiki/gems-taiwan/human-practices" target="_blank" rel="noopener">2025</a> ·
      <a href="https://timmy97-tw.github.io/releaf-wiki/human-practices/" target="_blank" rel="noopener">2026</a>
    </p>
  </div>
</footer>

<!-- detail sheet -->
<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <button type="button" class="sheet-close" id="sheet-close" aria-label="Close">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<!-- lightbox -->
<div class="lightbox" id="lightbox" hidden>
  <button type="button" class="lb-btn lb-close" id="lb-close" aria-label="Close">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <button type="button" class="lb-btn lb-prev" id="lb-prev" aria-label="Previous">‹</button>
  <figure class="lb-figure">
    <img id="lb-img" alt="">
    <figcaption id="lb-cap"></figcaption>
  </figure>
  <button type="button" class="lb-btn lb-next" id="lb-next" aria-label="Next">›</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="data/stakeholders.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
